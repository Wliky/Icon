<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>正在导入图标库…</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: #f2f5fa;
      color: #101828;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #070a10; color: #e8eaf0; }
      .box { background: rgba(22,27,38,.72); border-color: rgba(255,255,255,.10); }
      .url { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.12); color: #8b93a7; }
    }
    .box {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid rgba(15,23,42,.10);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(16,24,40,.12);
      padding: 30px 26px;
    }
    h1 { font-size: 17px; margin: 0 0 8px; }
    p { margin: 0 0 12px; font-size: 13.5px; opacity: .75; line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      .btn { background: linear-gradient(135deg, #3f9e3a, #7ed957); color: #06130a; }
    }
    .url {
      width: 100%;
      margin-top: 8px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(15,23,42,.12);
      background: rgba(15,23,42,.04);
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">正在唤醒客户端…</h1>
    <p id="tip">请在弹出的提示中选择「打开」</p>

    <div id="manual" hidden>
      <p>没有自动跳转？点下面按钮手动导入：</p>
      <a id="manualBtn" class="btn" href="#">手动一键导入</a>
    </div>

    <div id="fallback" hidden>
      <p style="margin-top:18px">或复制下面地址，到客户端的「图标库 / 图标订阅」里粘贴添加：</p>
      <input id="urlBox" class="url" type="text" readonly>
    </div>

    <p id="error" hidden style="color:#dc2626">参数错误：缺少图标库地址</p>
  </div>

  <script>
    var SCHEMES = {
      senplayer: function (u) { return 'senplayer://importicon?iconset=' + encodeURIComponent(u); },
      rodel:     function (u) { return 'rodelplayer://import-icon?url=' + encodeURIComponent(u); }
    };
    var NAMES = { senplayer: 'Senplayer', rodel: '小幻影视' };

    var params = new URLSearchParams(location.search);
    var iconset = params.get('iconset') || '';
    var to = params.get('to') || 'senplayer';

    if (!iconset) {
      document.getElementById('title').textContent = '参数错误';
      document.getElementById('tip').hidden = true;
      document.getElementById('error').hidden = false;
    } else {
      var build = SCHEMES[to] || SCHEMES.senplayer;
      var scheme = build(iconset);
      document.getElementById('tip').textContent =
        '正在把图标库导入 ' + (NAMES[to] || '客户端') + '，请在弹窗中选择「打开」';

      window.location.href = scheme;

      // 没装客户端时协议跳转不会有反应，3 秒后给出手动入口
      setTimeout(function () {
        document.getElementById('manual').hidden = false;
        document.getElementById('fallback').hidden = false;
        document.getElementById('manualBtn').href = scheme;
        document.getElementById('urlBox').value = iconset;
      }, 3000);

      document.getElementById('urlBox').addEventListener('click', function () {
        this.select();
      });
    }
  </script>
</body>
</html>
